name: Build Windows binary

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        run: uv run pytest -q

      - name: Build dist/scorer/scorer.exe
        run: uv run pyinstaller scorer.spec --noconfirm

      - name: Smoke test the binary
        run: uv run python scripts/smoke_test.py dist/scorer/scorer.exe

      # The artifact download is a zip of this folder: scorer.exe + _internal/.
      - uses: actions/upload-artifact@v4
        with:
          name: scorer-windows-x64
          path: dist/scorer

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Compress-Archive -Path dist/scorer -DestinationPath dist/scorer-windows-x64.zip
          gh release create "${{ github.ref_name }}" dist/scorer-windows-x64.zip --generate-notes
